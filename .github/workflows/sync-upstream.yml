name: 同步上游仓库

on:
  schedule:
    # 每天 04:00 UTC 执行 (北京时间 12:00)
    - cron: '0 4 * * *'
  
  # 允许手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史

      - name: 配置 Git 用户信息
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游仓库
        run: |
          git remote add upstream https://github.com/Jsnzkpg/Jsnzkpg.git

      - name: 获取上游更新
        run: |
          git fetch upstream

      - name: 同步上游分支
        run: |
          # 获取默认分支名称
          DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/upstream/HEAD | sed 's@^refs/remotes/upstream/@@')
          echo "默认分支: $DEFAULT_BRANCH"
          
          # 切换到该分支
          git checkout $DEFAULT_BRANCH
          
          # 合并上游分支，冲突时保留当前分支的改动
          git merge upstream/$DEFAULT_BRANCH --strategy-option=ours -m "同步上游: $DEFAULT_BRANCH" || true

      - name: 推送到远程仓库
        run: |
          DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/upstream/HEAD | sed 's@^refs/remotes/upstream/@@')
          git push origin $DEFAULT_BRANCH
